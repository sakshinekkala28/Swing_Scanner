name: Market Scan


###############################################################################
# Trigger
###############################################################################

on:

  workflow_dispatch:

    inputs:

      period:

        description: "Market data period"

        required: false

        default: "10y"


      interval:

        description: "Market data interval"

        required: false

        default: "1d"



###############################################################################
# Job
###############################################################################

jobs:


  scan:


    name: Execute Market Pipeline


    runs-on: ubuntu-latest


    timeout-minutes: 90



    steps:


      #########################################################################
      # Checkout
      #########################################################################

      - name: Checkout repository

        uses: actions/checkout@v4



      #########################################################################
      # Python Setup
      #########################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip



      #########################################################################
      # Install
      #########################################################################

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      #########################################################################
      # Execute Pipeline
      #########################################################################

      - name: Run scanner

        env:

          MARKET_PERIOD: ${{ inputs.period }}

          MARKET_INTERVAL: ${{ inputs.interval }}

          PYTHONUNBUFFERED: 1


        run: |

          python -m workflows.run_pipeline



      #########################################################################
      # Upload Results
      #########################################################################

      - name: Upload artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: market-scan-output

          path: |

            data/reports/

            data/exports/

            logs/

          retention-days: 30