name: Daily Market Scan


###############################################################################
# Trigger
###############################################################################

on:

  schedule:

    # Weekdays after Indian market close
    - cron: "30 12 * * 1-5"


  workflow_dispatch:



###############################################################################
# Permissions
###############################################################################

permissions:

  contents: read

  actions: write



###############################################################################
# Job
###############################################################################

jobs:


  market-scan:


    name: Run Swing Scanner


    runs-on: ubuntu-latest


    timeout-minutes: 60


    steps:


      #########################################################################
      # Checkout
      #########################################################################

      - name: Checkout repository

        uses: actions/checkout@v4



      #########################################################################
      # Python Setup
      #########################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"



      #########################################################################
      # Install Dependencies
      #########################################################################

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      #########################################################################
      # Environment Check
      #########################################################################

      - name: Validate environment

        run: |

          python --version

          pip list



      #########################################################################
      # Run Pipeline
      #########################################################################

      - name: Execute market scan

        env:

          PYTHONUNBUFFERED: 1

        run: |

          python -m workflows.market_pipeline



      #########################################################################
      # Upload Reports
      #########################################################################

      - name: Upload reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: swing-scanner-output

          path: |

            data/reports/

            data/exports/

            data/*.db

            logs/

          retention-days: 30