[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


###############################################################################
# Project Metadata
###############################################################################

[project]
name = "swing-scanner"

version = "1.0.0"

description = "Institutional Swing Trading Scanner Platform"

requires-python = ">=3.12"

authors = [
    {name = "Pavan Sai Nekkala"},
]


dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2",
    "pandas-ta",
    "plotly>=5.0",
    "streamlit>=1.30",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]


###############################################################################
# Development Dependencies
###############################################################################

[project.optional-dependencies]

dev = [

    "pytest>=8.0",

    "pytest-cov>=5.0",

    "pytest-xdist>=3.5",

    "pytest-timeout>=2.3",

    "ruff>=0.6",

    "mypy>=1.10",

    "pre-commit>=3.0",

]


###############################################################################
# Package Discovery
###############################################################################

[tool.setuptools.packages.find]

where = [
    ".",
]

exclude = [

    ".venv*",

    "tests*",

    "data*",

]


###############################################################################
# Ruff Configuration
###############################################################################

[tool.ruff]

target-version = "py312"

line-length = 88

extend-exclude = [

    ".venv",

    "data",

]


[tool.ruff.lint]

select = [

    "E",

    "F",

    "I",

    "B",

    "UP",

    "SIM",

]

ignore = [

    "E501",

]


[tool.ruff.lint.isort]

known-first-party = [

    "engine",

    "workflows",

    "core",

    "app",

]


###############################################################################
# Mypy Configuration
###############################################################################

[tool.mypy]

python_version = "3.12"

strict = false

ignore_missing_imports = true

warn_unused_configs = true

check_untyped_defs = true

disallow_untyped_defs = false


exclude = [

    ".venv",

    "data",

]


###############################################################################
# Pytest Configuration
###############################################################################

[tool.pytest.ini_options]

testpaths = [

    "tests",

]

python_files = [

    "test_*.py",

]

addopts = [

    "-v",

    "--tb=short",

]


###############################################################################
# Coverage Configuration
###############################################################################

[tool.coverage.run]

branch = true

source = [

    "engine",

    "workflows",

    "core",

]


[tool.coverage.report]

show_missing = true

exclude_lines = [

    "if __name__ == '__main__':",

]